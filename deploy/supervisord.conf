; TN Tenders Mirror — process supervisor for the single-container deployment.
;
; This file replaces seven systemd units. Each [program:] below names the unit
; it replicates; those unit files are in this directory and are still the
; primary source of *why* — they carry the incident numbers, the measured
; memory figures and the reasoning behind every interval. This file only
; records how each behaviour is expressed here and, where systemd can do
; something a container cannot, says so plainly instead of pretending.
;
; --------------------------------------------------------------------------
; Why supervisord and not s6-overlay, runit, tini+shell, or a container each
; --------------------------------------------------------------------------
;
; The deciding requirement is scripts/healthcheck.py. It is the watchdog that
; caught the 2026-08-15 wedge — the frontend alive, the port open, systemd
; reporting "active (running)", not one byte of any response served — and the
; way it heals that is `systemctl --user restart tenders-web.service`. It must
; keep working, it is not a file this containerisation is allowed to edit, and
; it has no environment override for the restart command (it has them for the
; probe URL and the storm-guard ledger, but restart_unit()'s argv is fixed).
;
; So the supervisor has to offer one thing above all: restart *one named
; process* from the command line, synchronously, with a truthful exit status,
; from inside the container. supervisorctl does exactly that, which lets a
; twelve-line `systemctl` shim in docker-entrypoint.sh translate the call and
; leave the watchdog untouched. s6 and runit can do it too (s6-svc, sv), but
; both want to own PID 1 and their own /run layout, and s6-overlay's init
; expects to start as root; supervisord is one pure-Python process that runs
; perfectly well as the unprivileged uid this image uses.
;
; The rest of the mapping is close to one-for-one:
;   Restart=always      -> autorestart=true
;   Restart=on-failure  -> autorestart=unexpected + exitcodes=
;   TimeoutStopSec=     -> stopwaitsecs=
;   StartLimitBurst=    -> startretries= (then FATAL instead of flapping)
;   Type=oneshot+timer  -> a loop in docker-entrypoint.sh (`every` / `daily`)
;   Nice=/IOSchedulingClass= -> nice/ionice prefixes on the command
;
; One container instead of seven was chosen because the seven processes share a
; single SQLite database *as their work queue* and a single documents tree.
; Splitting them across containers would mean sharing that database over a
; volume between containers, and SQLite's WAL locking depends on shared memory
; (the -shm file) that is only coherent within one kernel namespace mount of
; the same filesystem — it is safe here, but it is exactly the kind of thing
; that is safe until the day someone runs the two containers on different
; hosts. One container keeps the invariant obvious.
;
; --------------------------------------------------------------------------
; What is NOT reproduced: the per-unit memory budgets
; --------------------------------------------------------------------------
;
; deploy/*.service carries measured, individually-argued memory limits
; (extract 2G/4G after it peaked at 11.2 GB and starved the frontend into the
; wedge; scraper 2G/4G; web 1G/2G; award sweep 2G/4G after a 6.8 GB peak on a
; ~30 hour run). Those are cgroup limits, and a process supervisor cannot set
; them — only the container runtime can, and it can only set one for the whole
; container.
;
; What is deliberately NOT done is fake it with RLIMIT_AS. Address space is not
; resident memory, and db.py asks every reader for a 1 GB mmap window plus a
; 64 MB page cache; an RLIMIT_AS tight enough to bound the extract loop's real
; usage would kill the web frontend on its first query. A limit that fires on
; the wrong process is worse than no limit.
;
; Instead, docker-compose.yml sets a container-wide `mem_limit`, and the
; ordering works out: under a container-wide limit the kernel OOM-kills the
; largest consumer, and the whole point of the incident report in
; tenders-extract.service is that the runaway (6.7 GB resident) dwarfs the
; frontend (275 MB resident). The killed process is restarted by the rule below
; and resumes from database state, which is what Restart=on-failure bought on
; the host too. Anyone who wants true per-process budgets should run these as
; separate containers with per-container mem_limits; the unit files tell them
; the numbers.

[supervisord]
nodaemon=true
; With nodaemon=true supervisord already writes its own log to stdout, so
; `docker logs` is the whole story. The file sink is pointed at /dev/null
; rather than at /dev/fd/1 to avoid every supervisor line appearing twice, and
; rather than at a real path because a log written inside the container is a
; log that a rebuild silently discards.
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/tenders/supervisord.pid
; No user= here: the Dockerfile has already dropped to the tenders uid before
; supervisord starts, and the entrypoint re-drops if someone starts the
; container as root. user= would only be usable if supervisord itself were
; running as root, which is the thing being avoided.

[unix_http_server]
; The control socket is not optional decoration — it is how the watchdog heals
; the site (see the systemctl shim). 0700 because anything that can talk to
; this socket can start and stop every process in the container.
file=/var/run/tenders/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/tenders/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ===========================================================================
; tenders-web.service — the FastAPI/uvicorn frontend
; ===========================================================================
[program:web]
; --host 0.0.0.0 for the same reason the unit file gives: something outside
; this network namespace has to reach it (there, a dockerised Caddy via
; host.docker.internal; here, the published port). The port is env-driven so
; that the frontend and the watchdog cannot drift apart — healthcheck.py reads
; TENDERS_WEB_PORT too, and its DEFAULT_PORT comment describes exactly the bug
; that drift causes: probing a port nothing listens on and restarting a
; perfectly healthy service every two minutes forever.
command=tenders-web --host 0.0.0.0 --port %(ENV_TENDERS_WEB_PORT)s
directory=/app
autostart=%(ENV_TENDERS_ENABLE_WEB)s
; Restart=always.
autorestart=true
; RestartSec=5 has no equivalent; supervisor restarts immediately and backs off
; a second per consecutive failure. startsecs=10 is what makes "started" mean
; something: uvicorn has to import the app, and importing tenders.web.app runs
; init_db() against a 1.9 GB archive before it can serve anything.
startsecs=10
; systemd would also give up eventually (Restart=always is still bounded by the
; default StartLimitBurst=5 in 10s). A frontend that cannot start five times in
; a row is not going to start on the sixth try — the fault is a broken database
; or a broken checkout — and FATAL is a visible state. Recovery from FATAL is
; still automatic: `supervisorctl restart web` resets the counter, and that is
; precisely what the watchdog issues.
startretries=5
; tenders-web.service does not override TimeoutStopSec, so systemd gives it 90s.
; 30 is used here instead, and the difference is deliberate. 90s protects a
; graceful drain; uvicorn drains in well under a second, and the only in-flight
; request worth waiting on is somebody downloading a large captured document.
; Meanwhile the number is paid in full on every `docker compose down`, and —
; unlike systemd, which defaults to SendSIGCONT=yes and therefore wakes a
; stopped process as it signals it — supervisord does not, so a process wedged
; hard enough to ignore SIGTERM costs this full wait before SIGKILL.
;
; Measured end to end against a deliberately SIGSTOPped frontend in this
; container: 82 seconds from `healthcheck.py` starting to `RECOVERED` — 40s to
; confirm the wedge (3 probes x 10s plus 2 x 5s spacing), then 30s here, then
; SIGKILL, restart and the recovery probe. That is comfortably inside
; healthcheck.py's RESTART_TIMEOUT_S of 180, which is the budget that must not
; be blown: a restart that outlives it is a heal the watchdog abandons
; half-finished. At 90s it would still fit, but with far less margin and no
; benefit.
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; ===========================================================================
; tenders-scraper.service — the continuous capture loop
;
; This is the one process on this box whose work cannot be repeated later: the
; portal deletes a tender's documents when it closes, so a document not
; captured today is not captured at all. Everything else here yields to it.
; ===========================================================================
[program:scraper]
; --cycle-pause 900 --cancelled-every 6, exactly as the unit file runs it, but
; sourced from the environment so the two numbers that decide how much this
; asks of a live government portal are visible and documented rather than
; buried in a command line. Raising the pause is always safe; lowering it is
; the mistake docs/SELF-HOSTING.md warns about at length.
command=tenders-run --cycle-pause %(ENV_TENDERS_CYCLE_PAUSE)s --cancelled-every %(ENV_TENDERS_CANCELLED_EVERY)s
directory=/app
autostart=%(ENV_TENDERS_ENABLE_SCRAPER)s
; Restart=always. No nice/ionice, matching the unit file, which is the only
; long-running job here that sets neither: it is the priority work.
autorestart=true
; RestartSec=30 in the unit exists partly for politeness — every start
; bootstraps a fresh portal session — so a crash loop must not become a request
; loop. startsecs=60 means a process that dies inside its first minute counts as
; a failed start, and after three of those supervisor stops trying and leaves
; the program FATAL. Three extra session bootstraps is a rounding error against
; the portal; an unbounded restart loop would not be.
startsecs=60
startretries=3
; TimeoutStopSec=20: the work is idempotent and resumes from database state, so
; there is no reason to wait out a long enumeration pass on shutdown.
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=20
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; ===========================================================================
; tenders-extract.service — continuous text extraction + FTS indexing
;
; The unit that took the box down on 2026-08-15. Read its memory-budget comment
; before touching anything here; the container-wide limit note at the top of
; this file explains what could and could not be carried over.
; ===========================================================================
[program:extract]
; Nice=10 + IOSchedulingClass=idle. extract_loop.py already calls os.nice(10)
; on itself, so the nice prefix is belt-and-braces; ionice has no in-process
; equivalent and is the half that actually matters — OCR rasterises scanned
; pages to a temporary directory and the scraper shares this disk.
command=nice -n 10 ionice -c 3 python /app/scripts/extract_loop.py
directory=/app
autostart=%(ENV_TENDERS_ENABLE_EXTRACT)s
; Restart=on-failure. A clean exit is not expected (the loop is infinite), but
; if it ever does exit 0 that is a decision it made, not a fault to undo.
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=5
; RestartSec=120 in the unit; the cost of a restart here is one slice of
; extraction work, which the loop re-derives from database state.
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; ===========================================================================
; tenders-award-sweep.service — retrospective Award-of-Contract sweep
;
; ~30 hours of work that ends. When it finishes the queue it exits 0 and stays
; stopped, which is the correct final state and not a failure to correct — the
; award PDFs it collects are the richest evidence the portal publishes (every
; bidder, every quoted amount, the department's own estimate) and, unlike
; tender documents, they survive, so this is recoverable history rather than a
; race against deletion.
; ===========================================================================
[program:award-sweep]
; The restart policy is inside the wrapper, not here, and the argument for that
; is written out in full at `oneshot` in docker-entrypoint.sh. The short
; version: supervisord decides whether an exit was expected only after
; `startsecs` have elapsed, so a sweep that legitimately completes in under a
; second — which is what happens on a fresh archive, and on every restart after
; the sweep is done — is misfiled as a failed start and retried ten times in
; three seconds. Setting startsecs=0 fixes that and removes the only bound
; supervisord has on restarts, which for a job that makes portal requests is a
; worse bug than the one it fixes. The wrapper expresses all three parts at
; once: RestartSec=180, StartLimitBurst=10, and "exit 0 means finished".
;
; 180 and 10 are the unit file's own numbers.
command=/usr/local/bin/docker-entrypoint.sh oneshot 180 10 award-sweep -- nice -n 10 ionice -c 3 python /app/scripts/award_sweep.py
directory=/app
autostart=%(ENV_TENDERS_ENABLE_AWARD_SWEEP)s
; Never restarted by supervisor: the wrapper above has already decided, and a
; second restart policy stacked on top of the first would multiply the retries
; rather than bound them. An exhausted wrapper exits non-zero and stays EXITED,
; which is what `supervisorctl status` is for — the analogue of the failed-unit
; list the unit files use as their alarm channel.
autorestart=false
exitcodes=0
startsecs=0
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=40
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; ===========================================================================
; tenders-watch.timer — saved-search and bookmark push notifications, 5 min
;
; OnBootSec=3min, OnUnitActiveSec=5min, Persistent=false. The 5 minutes match
; [latest].poll_interval_s, which is the cadence at which new tenders are
; actually discovered; checking more often only re-asks a question whose answer
; cannot have changed.
;
; This never touches the portal — pure local SQLite plus a handful of HTTPS
; requests to push services — so it costs the politeness budget nothing. On a
; mirror with no VAPID key it is a no-op that logs and returns.
; ===========================================================================
[program:watch-timer]
command=/usr/local/bin/docker-entrypoint.sh every %(ENV_TENDERS_WATCH_INTERVAL)s 180 watch -- nice -n 5 ionice -c 3 tenders-watch-run
directory=/app
autostart=%(ENV_TENDERS_ENABLE_WATCH)s
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
priority=50
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; ===========================================================================
; tenders-healthcheck.timer — the self-healing watchdog, every 2 minutes
;
; The reason this container has a supervisor at all. OnBootSec=2min,
; OnUnitActiveSec=2min, Persistent=false — a missed liveness check is worthless
; information, since the question is only ever "is the site serving *now*".
;
; Note what is absent: no nice, no ionice. Every other batch job here yields,
; and this one must not. On 2026-08-15 the box was saturated by the extract
; loop, and a watchdog queued behind that runaway at idle I/O priority would
; have missed the entire event. Default scheduling is the most favourable
; setting available to an unprivileged process, which is exactly what the unit
; file settles for and for the same reason.
;
; It exits 1-4 whenever it had to act. The `every` loop logs that and carries
; on rather than treating it as a crash: non-zero here is the reporting
; channel, not a failure of the job.
; ===========================================================================
[program:healthcheck-timer]
command=/usr/local/bin/docker-entrypoint.sh every %(ENV_TENDERS_HEALTHCHECK_INTERVAL)s 120 healthcheck -- python /app/scripts/healthcheck.py
directory=/app
autostart=%(ENV_TENDERS_ENABLE_HEALTHCHECK)s
autorestart=true
startsecs=5
; Shorter than the 300s TimeoutStartSec the unit allows a single run, because
; what is being stopped is the loop, not a run: a heal in progress is at most
; 40s of probing plus a bounded restart, and interrupting one is safe — the
; ledger is written before the restart is issued, precisely so an interrupted
; attempt still counts against the storm guard.
stopwaitsecs=15
stopasgroup=true
killasgroup=true
priority=60
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; ===========================================================================
; tenders-dbmaint.timer — daily WAL guard and integrity report
;
; OnCalendar=04:30, Persistent=true, RandomizedDelaySec=600. This is the job
; that stands between the archive and a repeat of the 44 GB WAL against a 1.9 GB
; database that took the site down. It reports sizes, runs PRAGMA quick_check,
; and truncates the WAL only past the threshold; it never repairs, vacuums or
; deletes, because this archive holds the only surviving copy of documents the
; portal has already deleted and an automatic "fix" would overwrite the
; evidence.
;
; 04:30 and not 03:15 on purpose — that is when the captcha retrain below runs,
; and a full page scan competing with a 4-thread CNN on the same disk would
; make both slow for no reason.
; ===========================================================================
[program:dbmaint-timer]
command=/usr/local/bin/docker-entrypoint.sh daily %(ENV_TENDERS_DBMAINT_AT)s 600 dbmaint -- nice -n 10 ionice -c 3 python /app/scripts/db_maint.py
directory=/app
autostart=%(ENV_TENDERS_ENABLE_DBMAINT)s
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
priority=70
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; ===========================================================================
; tenders-captcha-train.timer — nightly retrain of the captcha CNN
;
; OnCalendar=03:15, Persistent=true. Every successful document-download captcha
; is auto-saved as a verified label, so this exists to periodically re-fit the
; CNN on whatever has accumulated. It is safe to fire unattended: train() no-ops
; unless MIN_NEW_LABELS=10 new verified labels have arrived, and it only
; replaces data/captcha/model.pt if the candidate beats the deployed model on
; the same validation split. A bad night cannot make the live solver worse.
;
; `|| true` (via sh -c, matching the unit file) because train() raises
; SystemExit when fewer than 30 labelled captchas exist — the state every fresh
; mirror starts in. That is a quiet no-op, not a failure.
;
; Nice=10 + idle I/O + a 4-thread cap inside train() itself: a full retrain is
; ~30 minutes of CPU and the live scraper shares this machine and has portal
; politeness delays it must keep meeting.
; ===========================================================================
[program:captcha-train-timer]
command=/usr/local/bin/docker-entrypoint.sh daily %(ENV_TENDERS_CAPTCHA_TRAIN_AT)s 600 captcha-train -- nice -n 10 ionice -c 3 sh -c "tenders-captcha-train || true"
directory=/app
autostart=%(ENV_TENDERS_ENABLE_CAPTCHA_TRAIN)s
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
priority=80
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

; Deliberately no [group:] section. A group renames every program to
; `tenders:web`, `tenders:scraper` and so on, and the whole reason this
; supervisor was chosen is that `supervisorctl restart web` is the target of
; the `systemctl` shim that keeps scripts/healthcheck.py working unmodified.
; Tidier status output is not worth putting a prefix between the watchdog and
; the process it heals.
